name: CI

# Trigger: push ke main/develop dan PR ke main/develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger for debugging

jobs:
  # ========================================
  # JOB 1: DISCOVER
  # Scan go.mod untuk deteksi versi stack
  # ========================================
  discover:
    name: Discover Services
    runs-on: self-hosted
    outputs:
      go-version: ${{ steps.discover.outputs.go-version }}
      node-version: ${{ steps.discover.outputs.node-version }}
      python-version: ${{ steps.discover.outputs.python-version }}
      services: ${{ steps.discover.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Discover stack versions
        id: discover
        run: |
          # Detect Go version from go.mod
          GO_VERSION=$(grep "^go " backend/go.mod | awk '{print $2}')
          echo "go-version=$GO_VERSION" >> $GITHUB_OUTPUT

          # Detect Node version (use 20 as baseline)
          NODE_VERSION="20"
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

          # Detect Python version (ai-runtime uses 3.11)
          PYTHON_VERSION="3.11"
          echo "python-version=$PYTHON_VERSION" >> $GITHUB_OUTPUT

          # Output service manifest
          cat << 'EOF' > services.json
          {
            "postgres": {
              "image": "postgres:18.4-alpine",
              "port": 5432,
              "env_prefix": "POSTGRES"
            },
            "redis": {
              "image": "redis:7-alpine",
              "port": 6379,
              "env_prefix": "REDIS"
            },
            "qdrant": {
              "image": "qdrant/qdrant:latest",
              "port": 6333,
              "env_prefix": "QDRANT"
            },
            "minio": {
              "image": "minio/minio:latest",
              "port": 9000,
              "env_prefix": "MINIO"
            },
            "rabbitmq": {
              "image": "rabbitmq:3-management-alpine",
              "port": 5672,
              "env_prefix": "RABBITMQ"
            }
          }
          EOF

          SERVICES_JSON=$(cat services.json | jq -c .)
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT

          echo "✅ Discovery complete:"
          echo "   Go: $GO_VERSION"
          echo "   Node: $NODE_VERSION"
          echo "   Python: $PYTHON_VERSION"
          echo "   Services: PostgreSQL 18.4, Redis, Qdrant, MinIO, RabbitMQ"

  # ========================================
  # JOB 2: LINT
  # golangci-lint dan go vet untuk backend
  # Paralel dengan test-unit dan test-integration
  # ========================================
  lint:
    name: Lint
    runs-on: self-hosted
    needs: discover
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ needs.discover.outputs.go-version }}
          cache: true

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6.1.0
        with:
          version: v1.62.0
          working-directory: ./backend
          args: --timeout=5m

  # ========================================
  # JOB 3: TEST-UNIT
  # Unit tests only, no external services, dengan race detection
  # Paralel dengan lint dan test-integration
  # ========================================
  test-unit:
    name: Unit Tests
    runs-on: self-hosted
    needs: discover
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ needs.discover.outputs.go-version }}
          cache: true

      - name: Run unit tests with race detection
        working-directory: ./backend
        run: |
          go test -v -race -coverprofile=coverage.out -short $(go list ./... | grep -v integration)

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4.4.0
        with:
          name: unit-coverage
          path: backend/coverage.out

  # ========================================
  # JOB 4: TEST-INTEGRATION
  # Integration tests — services dijalankan via Podman Compose
  # Karena self-hosted, tidak pakai services: block
  # Paralel dengan lint
  # ========================================
  test-integration:
    name: Integration Tests
    runs-on: self-hosted
    needs: discover
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Start services via Podman Compose
        run: |
          podman-compose -f docker-compose.dev.yml up -d || {
            echo "❌ Service startup failed, checking logs..."
            podman-compose -f docker-compose.dev.yml logs
            exit 1
          }
          echo "⏳ Waiting for services to be ready..."
          sleep 30  # Increased wait time to ensure all services start

      - name: Verify services health
        run: |
          # PostgreSQL
          until podman exec $(podman ps -qf "name=postgres") pg_isready -U nusa; do
            echo "Waiting for PostgreSQL..."; sleep 3
          done
          echo "✅ PostgreSQL ready"

          # Redis
          until podman exec $(podman ps -qf "name=redis") redis-cli ping | grep PONG; do
            echo "Waiting for Redis..."; sleep 3
          done
          echo "✅ Redis ready"

          # MinIO
          until curl -sf http://localhost:9000/minio/health/live; do
            echo "Waiting for MinIO..."; sleep 5
          done
          echo "✅ MinIO ready"

          # Qdrant
          until curl -sf http://localhost:6333/health; do
            echo "Waiting for Qdrant..."; sleep 5
          done
          echo "✅ Qdrant ready"

          # RabbitMQ
          until curl -sf http://localhost:15672 > /dev/null; do
            echo "Waiting for RabbitMQ..."; sleep 5
          done
          echo "✅ RabbitMQ ready"

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ needs.discover.outputs.go-version }}
          cache: true

      - name: Run integration tests
        working-directory: ./backend
        env:
          # PostgreSQL - using TEST_DB_* for integration test compatibility
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: nusa
          TEST_DB_PASSWORD: nusa_secret
          TEST_DB_NAME: nusa_test
          TEST_DB_SSLMODE: disable
          
          # Also set POSTGRES_* for any code that might use them
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: nusa_test
          POSTGRES_USER: nusa
          POSTGRES_PASSWORD: nusa_secret
          POSTGRES_SSLMODE: disable

          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0

          # Qdrant
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333

          # MinIO
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: nusa-test
          MINIO_REGION: us-east-1
          MINIO_SECURE: false

          # RabbitMQ
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          RABBITMQ_QUEUE: ai_generation

          # JWT
          JWT_SECRET: test-secret-key-for-ci-only
          JWT_EXPIRATION: 24h

          # AI
          AI_PRIMARY_PROVIDER: openai
          AI_OPENAI_KEY: test-key-for-ci-only

          # App
          APP_ENV: test
          SERVER_PORT: :8080
        run: |
          # Run integration tests only (skip unit tests to avoid duplication)
          go test -v -coverprofile=integration-coverage.out ./tests/integration/...
          go tool cover -html=integration-coverage.out -o coverage.html

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4.4.0
        with:
          name: integration-coverage
          path: |
            backend/integration-coverage.out
            backend/coverage.html

      - name: Stop services
        if: always() # Tetap stop meski test gagal
        run: |
          podman-compose -f docker-compose.dev.yml down -v || true
          podman ps -a  # Show remaining containers for debugging

  # ========================================
  # JOB 5: BUILD
  # Go build + frontend build
  # Menunggu semua job selesai
  # ========================================
  build:
    name: Build
    runs-on: self-hosted
    needs: [discover, lint, test-unit, test-integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ needs.discover.outputs.go-version }}
          cache: true

      - name: Build backend binary
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o bin/api cmd/api/main.go
          file bin/api
          ./bin/api --version || echo "No version flag, binary exists"

      - name: Cache node modules
        uses: actions/cache@v4.1.1
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: build-artifacts
          path: |
            backend/bin/api
            frontend/dist/

  # ========================================
  # JOB 6: DOCKER-BUILD
  # Multi-stage Podman build, hanya pada push ke main/develop
  # Menggunakan Podman karena self-hosted di Fedora
  # ========================================
  docker-build:
    name: Docker Build
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build and push backend image
        run: |
          podman build \
            -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/backend:latest \
            -f ./backend/Dockerfile \
            ./backend

          podman push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          podman push ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend image
        run: |
          podman build \
            -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/frontend:latest \
            -f ./frontend/Dockerfile \
            ./frontend

          podman push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          podman push ghcr.io/${{ github.repository }}/frontend:latest

      - name: Clean up local images
        if: always()
        run: |
          podman image prune -f

  # ========================================
  # JOB 7: SECURITY-SCAN
  # govulncheck + Trivy
  # Non-blocking (continue-on-error: true)
  # ========================================
  security-scan:
    name: Security Scan
    runs-on: self-hosted
    needs: [discover, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ needs.discover.outputs.go-version }}
          cache: true

      - name: Run govulncheck
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Trivy vulnerability scanner
        run: |
          # Install Trivy jika belum ada
          which trivy || (
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin
          )
          trivy fs --format sarif --output trivy-results.sarif .

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3.26.11
        with:
          sarif_file: 'trivy-results.sarif'