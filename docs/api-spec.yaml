components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    # TP Schemas
    KKTPCriteria:
      type: object
      properties:
        mastery_thresholds:
          $ref: '#/components/schemas/MasteryThresholds'
        performance_indicators:
          $ref: '#/components/schemas/PerformanceIndicators'
        minimum_requirements:
          $ref: '#/components/schemas/MinimumRequirements'

    MasteryThresholds:
      type: object
      properties:
        excellent_threshold:
          type: number
          format: float
        proficient_threshold:
          type: number
          format: float
        developing_threshold:
          type: number
          format: float
        beginning_threshold:
          type: number
          format: float

    PerformanceIndicators:
      type: object
      properties:
        cognitive:
          type: array
          items:
            type: string
        psychomotor:
          type: array
          items:
            type: string
        affective:
          type: array
          items:
            type: string

    MinimumRequirements:
      type: object
      properties:
        core_competencies:
          type: array
          items:
            type: string
        essential_skills:
          type: array
          items:
            type: string
        required_evidence:
          type: array
          items:
            type: string

    WorkflowStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED]

    GenerationSource:
      type: string
      enum: [AI_GENERATED, MANUAL]

    TPSetResponse:
      type: object
      properties:
        id:
          type: string
        cp_id:
          type: string
        cp_code:
          type: string
        cp_text:
          type: string
        version_no:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        generation_source:
          $ref: '#/components/schemas/GenerationSource'
        generation_reason:
          type: string
        generated_by:
          type: string
        generated_by_name:
          type: string
        ai_generation_id:
          type: string
        approved_by:
          type: string
        approved_by_name:
          type: string
        approved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTPSetRequest:
      type: object
      required:
        - cp_id
        - version_no
        - generation_source
      properties:
        cp_id:
          type: string
        version_no:
          type: integer
          minimum: 1
        generation_source:
          $ref: '#/components/schemas/GenerationSource'
        generation_reason:
          type: string

    ApproveTPSetRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 5

    TPResponse:
      type: object
      properties:
        id:
          type: string
        tp_set_id:
          type: string
        sequence_number:
          type: integer
        cp_id:
          type: string
        cp_code:
          type: string
        cp_text:
          type: string
        subject_id:
          type: string
        subject_code:
          type: string
        subject_name:
          type: string
        phase_id:
          type: string
        phase_code:
          type: string
        phase_name:
          type: string
        element_id:
          type: string
        element_code:
          type: string
        element_name:
          type: string
        subelement_id:
          type: string
        subelement_code:
          type: string
        subelement_name:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        title:
          type: string
        learning_objectives:
          type: object
        time_allocation:
          type: object
        prerequisites:
          type: object
        estimated_weeks:
          type: integer
        success_criteria:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTPRequest:
      type: object
      required:
        - tp_set_id
        - sequence_number
        - cp_id
        - subject_id
        - phase_id
        - element_id
        - subelement_id
        - user_id
        - learning_objectives
        - time_allocation
      properties:
        tp_set_id:
          type: string
        sequence_number:
          type: integer
          minimum: 1
        cp_id:
          type: string
        subject_id:
          type: string
        phase_id:
          type: string
        element_id:
          type: string
        subelement_id:
          type: string
        user_id:
          type: string
        title:
          type: string
        learning_objectives:
          type: object
        time_allocation:
          type: object
        prerequisites:
          type: object
        estimated_weeks:
          type: integer
        success_criteria:
          type: object

    UpdateTPRequest:
      type: object
      properties:
        title:
          type: string
        learning_objectives:
          type: object
        time_allocation:
          type: object
        prerequisites:
          type: object
        estimated_weeks:
          type: integer
        success_criteria:
          type: object
        status:
          $ref: '#/components/schemas/WorkflowStatus'

    # ATP Schemas
    ATPSetResponse:
      type: object
      properties:
        id:
          type: string
        tp_set_id:
          type: string
        version_no:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        generated_by:
