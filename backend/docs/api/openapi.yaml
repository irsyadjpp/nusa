      type: object
      properties:
        id:
          type: string
        student_id:
          type: string
        student_name:
          type: string
        rubric_id:
          type: string
        rubric_type:
          type: string
        evidence_id:
          type: string
        evidence_type:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        performance_scores:
          type: object
        total_score:
          type: integer
        max_score:
          type: integer
        performance_level:
          $ref: '#/components/schemas/PerformanceLevel'
