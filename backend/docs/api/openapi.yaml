        status:
          $ref: '#/components/schemas/WorkflowStatus'
        performance_criteria:
          type: object
        performance_levels:
          type: object
        scoring_guidelines:
          type: object
        ai_confidence_score:
          type: number
          format: float
        ai_generated_at:
          type: string
          format: date-time
        ai_agent_version:
          type: string
        version_no:
          type: integer
        is_current_version:
          type: boolean
        parent_version_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
        approved_by:
          type: string
        approved_by_name:
          type: string

    CreateRubricRequest:
      type: object
      required:
