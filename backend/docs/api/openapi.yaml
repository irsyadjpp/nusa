          type: string
        tp_set_id:
          type: string
        version_no:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        generated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

