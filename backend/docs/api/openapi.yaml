              schema:
                $ref: '#/components/schemas/TPResponse'
    get:
      tags:
        - TP (Teaching Plan)
      summary: List TPs
      description: Get a paginated list of Teaching Plans
      security:
        - bearerAuth: []
      parameters:
        - name: tp_set_id
          in: query
          description: Filter by TP Set ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [DRAFT, PENDING, APPROVED, REJECTED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: TPs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tps:
                    type: array
                    items:
                      $ref: '#/components/schemas/TPResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

