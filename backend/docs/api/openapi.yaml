openapi: 3.0.3
info:
  title: NUSA Education Operating System API
  description: |
    RESTful API for the NUSA Education Operating System.
    This API supports Kurikulum Merdeka (Indonesian National Curriculum 2024).
  version: 1.0.0
  contact:
    name: NUSA Team
    email: api@nusa.id

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.nusa.id/v1
    description: Production server

tags:
  - name: TP (Teaching Plan)
    description: Teaching Plan management endpoints
  - name: ATP (Alur Tujuan Pembelajaran)
    description: ATP management endpoints
  - name: Modul Ajar
    description: Modul Ajar management endpoints
  - name: Assessment
    description: Assessment management endpoints
  - name: Rubric
    description: Rubric management endpoints
  - name: Evidence
    description: Evidence management endpoints
  - name: Evaluation
    description: Evaluation management endpoints
  - name: Report
    description: Narrative Report management endpoints
  - name: Achievement
    description: Achievement calculation endpoints (runtime, no persistence)

paths:
  /tp-sets:
    post:
      tags:
        - TP (Teaching Plan)
      summary: Create a new TP Set
      description: Create a new Teaching Plan Set from a CP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTPSetRequest'
      responses:
        '201':
          description: TP Set created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPSetResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - TP (Teaching Plan)
      summary: List TP Sets
      description: Get a paginated list of TP Sets
      security:
        - bearerAuth: []
      parameters:
        - name: cp_id
          in: query
          description: Filter by CP ID
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Page size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: TP Sets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tp_sets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TPSetResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /tp-sets/{id}:
    get:
      tags:
        - TP (Teaching Plan)
      summary: Get TP Set by ID
      description: Retrieve a specific TP Set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TP Set retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPSetResponse'
        '404':
          description: TP Set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tp-sets/{id}/approve:
    post:
      tags:
        - TP (Teaching Plan)
      summary: Approve TP Set
      description: Approve a TP Set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTPSetRequest'
      responses:
        '200':
          description: TP Set approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /tps:
    post:
      tags:
        - TP (Teaching Plan)
      summary: Create a new TP
      description: Create a new Teaching Plan item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
