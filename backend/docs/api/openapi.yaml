          in: query
          description: Filter by status
          schema:
            type: string
            enum: [DRAFT, PENDING, PUBLISHED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
